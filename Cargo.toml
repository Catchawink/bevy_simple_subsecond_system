[workspace]
members = [".", "examples/*", "macros"]

[package]
name = "bevy_simple_subsecond_system"
version = "0.2.0"
edition = "2024"
authors = ["Jan Hohenheim <jan@hohenheim.ch>"]
exclude = ["examples/"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/janhohenheim/bevy_simple_subsecond_system"
description = "Hotpatch your Bevy systems, allowing you to change their code while the app is running and directly seeing the results!"
keywords = ["bevy", "hotpatch", "subsecond", "dioxus"]
readme = "readme.md"
categories = ["game-development"]

[dependencies]
bevy_ecs = { git = "https://github.com/empathic-ai/bevy.git", branch = "reflect/serializable-dynamic-types" }
bevy_log = { git = "https://github.com/empathic-ai/bevy.git", branch = "reflect/serializable-dynamic-types" }
bevy_app = { git = "https://github.com/empathic-ai/bevy.git", branch = "reflect/serializable-dynamic-types" }
bevy_derive = { git = "https://github.com/empathic-ai/bevy.git", branch = "reflect/serializable-dynamic-types" }
bevy_platform = { git = "https://github.com/empathic-ai/bevy.git", branch = "reflect/serializable-dynamic-types" }
bevy_ecs_macros = { git = "https://github.com/empathic-ai/bevy.git", branch = "reflect/serializable-dynamic-types" }
bevy_reflect = { git = "https://github.com/empathic-ai/bevy.git", branch = "reflect/serializable-dynamic-types" }
bevy_utils = { git = "https://github.com/empathic-ai/bevy.git", branch = "reflect/serializable-dynamic-types" }
bevy_internal = { git = "https://github.com/empathic-ai/bevy.git", branch = "reflect/serializable-dynamic-types", default-features = false, features = ["track_location"] }
dioxus-devtools = "0.7.0-alpha.1"
bevy_simple_subsecond_system_macros = { path = "macros", version = "0.1.9" }
crossbeam-channel = "0.5.15"
send_wrapper = "0.6.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus-cli-config = { version = "0.7.0-alpha.1", features = ["web"] }
serde_json = { version = "1.0" }

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3.77"
features = [
    "Window",
    "Location",
    "CloseEvent",
    "MessageEvent",
    "WebSocket"
]

[dev-dependencies]
bevy = { git = "https://github.com/empathic-ai/bevy.git", branch = "reflect/serializable-dynamic-types", default-features = false, features = ["bevy_ui_debug", "track_location"] }

[lints.clippy]
# Bevy supplies arguments to systems via dependency injection, so it's natural for systems to
# request more than 7 arguments, which would undesirably trigger this lint.
too_many_arguments = "allow"
# Queries may access many components, which would undesirably trigger this lint.
type_complexity = "allow"
# Make sure macros use their standard braces, such as `[]` for `bevy_ecs::children!`.
nonstandard_macro_braces = "warn"

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
